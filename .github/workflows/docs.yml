name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the deploy job widens it for itself.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --strict fails the build on a broken internal link or a page
      # missing from the nav. Keep it strict; a silently dead link in
      # product documentation is worse than a red build.
      - run: mkdocs build --strict
      # Only main publishes, so a pull request stops at the strict build
      # above and does not need to carry an artifact.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only main publishes; pull requests stop at the strict build above.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement: true turns Pages on for the repository and sets the
      # source to GitHub Actions on the first run, so publishing needs no
      # manual trip through Settings then Pages. It is a no-op once enabled.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
