<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 656" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">ARGUS hub and cluster agents</title>
  <desc id="architecture-desc">Your browser connects to the hub over HTTPS. The hub serves the web interface and API, manages incidents and investigations, and keeps an audit trail. It stores its state in PostgreSQL and calls an AI provider through an API endpoint or an Agent CLI runner. An agent in each watched cluster initiates an outbound mutual-TLS WebSocket tunnel to the hub. No inbound connection to a watched cluster is required.</desc>
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow" d="M0 0 8 4 0 8Z"/></marker>
    <marker id="architecture-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="d-arrow--accent" d="M0 0 8 4 0 8Z"/></marker>
  </defs>

  <text class="d-label" x="32" y="36">ONE HUB · AN AGENT IN EACH CLUSTER</text>

  <path class="d-line" d="M242 116H440V152" marker-end="url(#architecture-arrow)"/>
  <text class="d-muted d-centred" x="340" y="102">HTTPS</text>
  <path class="d-line" d="M600 238H648" marker-end="url(#architecture-arrow)"/>
  <path class="d-line" d="M280 320H242" marker-end="url(#architecture-arrow)"/>

  <rect class="d-card" x="32" y="68" width="210" height="96" rx="12"/>
  <rect class="d-chip" x="50" y="88" width="40" height="40" rx="10"/>
  <svg class="d-icon" x="58" y="96" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="17" rx="2"/><path d="M2 8H22M6 5.5H6.1M9 5.5H9.1"/></svg>
  <text class="d-title" x="104" y="109">Your browser</text>
  <text class="d-muted" x="104" y="133">Web interface</text>

  <rect class="d-card--accent" x="280" y="152" width="320" height="222" rx="14"/>
  <svg class="d-icon" x="302" y="174" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5H7.1M7 17.5H7.1M11 6.5H17M11 17.5H17"/></svg>
  <text class="d-title" x="346" y="195">Hub</text>
  <text class="d-label" x="504" y="192">RUN ONCE</text>
  <path class="d-line" d="M302 222H578" opacity=".35"/>
  <text x="302" y="249">Web interface and API</text>
  <text x="302" y="274">Incident state machine</text>
  <text x="302" y="299">Investigation orchestration</text>
  <text x="302" y="324">Audit trail</text>
  <text class="d-muted" x="302" y="353">No kubeconfig held by the hub</text>

  <rect class="d-card" x="648" y="180" width="264" height="126" rx="12"/>
  <rect class="d-chip" x="666" y="198" width="40" height="40" rx="10"/>
  <svg class="d-icon" x="674" y="206" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 14.5 9.5 22 12 14.5 14.5 12 22 9.5 14.5 2 12 9.5 9.5ZM20 2V6M18 4H22"/></svg>
  <text class="d-title" x="720" y="223">AI provider</text>
  <text class="d-muted" x="668" y="261">API endpoint or Agent CLI runner</text>
  <text class="d-muted" x="668" y="283">One provider active at a time</text>

  <rect class="d-card" x="32" y="266" width="210" height="108" rx="12"/>
  <rect class="d-chip" x="50" y="284" width="40" height="40" rx="10"/>
  <svg class="d-icon" x="58" y="292" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5V19C4 23 20 23 20 19V5M4 12C4 16 20 16 20 12"/></svg>
  <text class="d-title" x="102" y="309">PostgreSQL</text>
  <text class="d-muted" x="50" y="347">Persistent state and credentials</text>

  <rect class="d-zone" x="160" y="476" width="290" height="140" rx="14"/>
  <rect class="d-zone" x="510" y="476" width="290" height="140" rx="14"/>
  <path class="d-flow" d="M305 522V454H655V522"/>
  <path class="d-flow" d="M440 454V374" marker-end="url(#architecture-arrow-accent)"/>
  <text x="468" y="408">Mutual TLS over WebSocket</text>
  <text class="d-muted" x="468" y="431">Agents dial out and keep the tunnel open</text>

  <text class="d-label" x="180" y="502">CLUSTER A</text>
  <rect class="d-card" x="178" y="522" width="254" height="76" rx="10"/>
  <svg class="d-icon" x="198" y="544" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7V17L12 22 3 17V7ZM12 8V16M8.5 10 15.5 14M8.5 14 15.5 10"/><circle cx="12" cy="12" r="4"/></svg>
  <text class="d-title" x="244" y="554">Agent</text>
  <text class="d-muted" x="244" y="577">Watches this cluster</text>

  <text class="d-label" x="530" y="502">CLUSTER B</text>
  <rect class="d-card" x="528" y="522" width="254" height="76" rx="10"/>
  <svg class="d-icon" x="548" y="544" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7V17L12 22 3 17V7ZM12 8V16M8.5 10 15.5 14M8.5 14 15.5 10"/><circle cx="12" cy="12" r="4"/></svg>
  <text class="d-title" x="594" y="554">Agent</text>
  <text class="d-muted" x="594" y="577">Watches this cluster</text>

  <text class="d-muted d-centred" x="472" y="644">No inbound connection to a watched cluster is required.</text>
</svg>
