<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" role="img" aria-label="ARGUS aperture mark">
  <!--
    The aperture mark (identity study, direction A1), matching the in-app
    ArgusLogoMark: twelve iris blades, three of them stopping short at 26%
    opacity, and a pupil. Never fully open, which is the one detail of the
    Argus Panoptes myth worth keeping.

    THREE RULES FOR EDITING THIS FILE. The first two were learned the hard way.

    1. NO DOUBLE HYPHEN ANYWHERE IN A COMMENT. XML forbids it inside a comment,
       so an SVG that contains one is not merely quirky, it is malformed: every
       browser refuses to parse the document and renders no icon at all, with
       nothing in the console and a correct 200 and Content-Type on the wire.
       This file sat broken for exactly that reason, because a comment
       referenced a CSS custom property by its spelling. Say "the accent
       token", never the token name. src/brand-assets.test.ts now fails on it.

    2. NO CSS, and no `currentColor`. A favicon is rasterized outside the page,
       so there is nothing to inherit from and no guarantee that whatever
       rasterizes it supports a stylesheet or a media query. Colour is a
       literal on one group, and the blades that stop short are drawn short
       rather than transformed. The component does the same thing with one
       blade shape plus a CSS retraction, which it can afford because it lives
       in a real DOM and has to animate; here the geometry is written out
       twice as the price of depending on nothing.

    3. THIS DRAWING IS HINTED, so it is NOT a copy of the component's numbers
       and should not be "corrected" into one. A favicon is only ever seen at
       16 to 32 pixels, and at 16 the component's 3.4-wide blade is 0.85 of a
       device pixel: it renders as pale grey fuzz, technically present and
       visually absent. Compared side by side at 16, 20 and 32, the blade width
       went to 4.8 and the outer radius to 28, which gives every blade real
       ink. Same instrument, drawn for the size it is actually used at.

    4. THE viewBox IS THE DRAWING'S BOUNDING BOX, NOT THE 64 GRID THE NUMBERS
       ARE WRITTEN ON, and that is the point rather than an oversight. A tab
       renders this into a box roughly 16 pixels on a side and adds no padding
       of its own, so any margin inside the file is margin the icon can never
       get back: at radius 28 on a 64 grid, 6% of every edge was empty and the
       mark was drawn at 87% of the size available to it. `4 4 56 56` is
       exactly the extent of the ink (blade tips at radius 28 about (32,32),
       so 32 +/- 28), which scales the whole mark up by 1.143 with no shape
       touched and no proportion changed. The blade goes from 1.20 to 1.37
       device pixels at 16, and the pupil from 3.3 to 3.8.

       This is as large as a radial mark can be in a square without losing
       something: the blades at 0, 180 and 270 degrees now touch the top,
       bottom and left edges, so any further crop clips their tips.

       The right edge keeps a sliver of air, and that is the MARK, not margin.
       The blade pointing right is at 90 degrees, which is one of the three
       that sleep, so it stops halfway; the rightmost ink comes from the two
       diagonals either side of it. Any trio of blades 120 degrees apart
       contains exactly one of the four cardinals, so no choice of sleeping
       trio avoids this, and the trio is fixed at 90/210/330 to match the
       component's resting state. Cropping the air away would mean an
       off-centre mark, which is why the test requires this viewBox to stay
       square and centred on (32,32) rather than merely tight.

       If a redraw ever changes the outer radius, this viewBox has to move with
       it; the test asserts that they still agree.

    What is NOT hinted is the relationship between the two blade lengths: a
    sleeping blade is half of a waking one, measured from the inner end at
    radius 9, exactly as the component's scaleY(0.5) about y=23 computes it.
    That proportion is what makes this read as the same mark, so it is pinned
    by test rather than left to the next edit.

    One colour, and no dark-theme variant. This file used to lighten on a dark
    tab strip, which contradicts the standing decision that the mark holds
    3c7d7d on every ground while the type around it is what follows the theme.
    Against the two extremes a tab strip actually paints, that colour holds
    3.4:1 or better, clearing the 3:1 a graphic needs.

    Geometry is written on a 64 grid about (32,32) even though the viewBox
    crops to 4 4 56 56, because the numbers are radii from the centre and a
    centre at (32,32) is what keeps them readable: blade 4.8 wide spanning
    radius 9 to 28, twelve positions at 30 degrees; the three at 90, 210 and
    330 stop halfway, at radius 18.5; pupil r6.6.
  -->
  <g fill="#3c7d7d">
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(0 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(30 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(60 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(120 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(150 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(180 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(240 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(270 32 32)"/>
    <rect x="29.6" y="4" width="4.8" height="19" rx="2.4" transform="rotate(300 32 32)"/>
    <g opacity="0.26">
    <rect x="29.6" y="13.5" width="4.8" height="9.5" rx="2.4" transform="rotate(90 32 32)"/>
    <rect x="29.6" y="13.5" width="4.8" height="9.5" rx="2.4" transform="rotate(210 32 32)"/>
    <rect x="29.6" y="13.5" width="4.8" height="9.5" rx="2.4" transform="rotate(330 32 32)"/>
    </g>
    <circle cx="32" cy="32" r="6.6"/>
  </g>
</svg>
